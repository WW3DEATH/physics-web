<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="3" />

  <!-- Atomic Orbital Ellipses -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Orbit 1 (Horizontal) -->
    <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-dasharray="140 10" />
    <circle cx="44" cy="0" r="4.5" fill="#38bdf8" />

    <!-- Orbit 2 (Rotated 60 deg) -->
    <g transform="rotate(60)">
      <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-dasharray="140 10" />
      <circle cx="-44" cy="0" r="4.5" fill="#22d3ee" />
    </g>

    <!-- Orbit 3 (Rotated 120 deg) -->
    <g transform="rotate(120)">
      <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#60a5fa" stroke-width="4.5" stroke-dasharray="140 10" />
      <circle cx="44" cy="0" r="4.5" fill="#60a5fa" />
    </g>

    <!-- Central Glowing Core / Nucleus -->
    <circle cx="0" cy="0" r="10" fill="url(#cyanBlue)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
